# Alacritty config — mirrors ~/.config/kitty/kitty.conf
# (set up as an XIM-capable terminal so fcitx5/Mozc Japanese input works,
#  which kitty can't do on X11). Colors come from pywal, same as kitty.

[general]
# pywal-generated palette (regenerated by `wal -R` in ~/.xprofile at login)
import = ["~/.cache/wal/colors-alacritty.toml"]
live_config_reload = true

[window]
# kitty: remember_window_size no / initial 80c x 24c
dimensions = { columns = 80, lines = 24 }

[font]
size = 9.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[cursor]
# kitty: cursor_shape block / cursor_blink_interval 0
style = { shape = "Block", blinking = "Off" }
